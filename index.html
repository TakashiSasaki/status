<style>
:root{color-scheme:light; font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#17243a;background:#f5f7fb}
*{box-sizing:border-box}body{margin:0} .wrap{max-width:960px;margin:auto;padding:0 24px}
